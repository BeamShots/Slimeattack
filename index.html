<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172c"><meta name="description" content="Tap, evolve and unleash a storm of slime-shattering powers."><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon192.png"><link rel="stylesheet" href="./style.css"><title>Slimefall · Eternal Expedition</title></head>
<body><main id="app">
<header><div class="brand">SLIMEFALL<small>ETERNAL EXPEDITION · v5.0</small></div><div class="wallet"><span id="coins">0</span><span id="shards">0</span></div><button id="settings" class="iconButton" aria-label="Settings">⚙</button></header>
<section id="home" class="screen active">
<div class="homeHero" id="villageScene"><div class="villageTitle"><div class="eyebrow">TAP A LOCATION</div><h1>Moonhaven</h1><div id="homeStats" class="homeStats"></div></div>
<button class="villageSpot forgeSpot" data-page="runes"><span class="havenIcon" data-haven-icon="0"></span><b>Runeforge</b></button>
<button class="villageSpot pondSpot" data-page="fishing"><span class="havenIcon" data-haven-icon="1"></span><b>Moonpool</b></button>
<button class="villageSpot starsSpot" data-page="stars"><span class="havenIcon" data-haven-icon="2"></span><b>Star map</b></button>
<div id="restorationMarks" aria-label="Restored landmarks"></div><div class="restoreGlow" aria-hidden="true"></div>
<button id="play" class="primary">ENTER THE RIFT <span>→</span></button><button id="resume" hidden>Continue your run</button>
</div>
<div class="homeBottom"><button id="expeditionStatus" class="expeditionEntry"><span class="expIcon" data-exp-icon="0"></span><span><b>Eternal expedition</b><small id="expeditionInfo">Offline waves are ready</small></span><span>→</span></button><div class="homeExtras"><button id="openForge">✧ Moonforge & orders</button><button id="openResearch">✦ Stardust research</button></div><button id="havenStatus" data-page="village" class="havenStatus"></button><div class="idlePanel frame"><div class="row"><span class="skillIcon" data-icon="11"></span><div><h3>Gel sanctuary</h3><p id="idleInfo"></p></div><button id="claimIdle" class="primary">Collect</button></div></div><nav id="homeNav"><button data-page="workshop"><span class="skillIcon" data-icon="0"></span><span>Ascension</span></button><button data-page="collection"><span class="skillIcon" data-icon="33"></span><span>Grimoire</span></button><button data-page="bestiary"><span class="enemySprite navPet"></span><span>Slimes</span></button><button data-page="milestones"><span class="skillIcon" data-icon="15"></span><span>Milestones</span></button></nav></div>
</section>
<section id="combat" class="screen">
<div class="battleHud"><div class="row"><span id="waveLabel"></span><button id="buildInfo" class="tiny">Your build</button><button id="pause" class="tiny" aria-label="Pause">Ⅱ</button></div><div class="row"><span id="health"></span><span id="battleStats"></span></div><div id="realmLabel" class="realmInfo"></div><div class="progress"><i id="waveProgress"></i></div></div>
<div id="arena"><canvas id="battleCanvas" aria-label="Slime battlefield. Tap or hold enemies to attack."></canvas><div id="battleBanner" role="status"></div><div id="combo"></div><div class="dangerLine">KEEP THEM ABOVE THE WARD</div></div>
<div class="battleTools"><button id="pilotToggle">Pilot · OFF</button><button id="battleForge">✧ Open forge</button><button id="battleOrders">Orders</button></div><aside id="forgeDrawer" hidden aria-label="Moonforge"><div class="drawerHeading"><b>Moonforge · battle continues</b><button id="closeForge">× Close</button></div><div id="drawerContent"></div></aside><div id="actionInfo" class="actionInfo"></div><div class="energyTrack"><i id="energyFill"></i></div><div class="abilities"><button id="frost" class="ability"><span class="skillIcon" data-icon="4"></span><span><b>Frost nova</b><small id="frostLabel">READY</small></span></button><button id="fury" class="ability"><span class="skillIcon" data-icon="2"></span><span><b>Overcharge</b><small id="furyLabel">READY</small></span></button><button id="burst" class="ability"><span class="skillIcon" data-icon="32"></span><span><b>Soul Burst</b><small id="burstLabel">0%</small></span></button></div>
<div id="petStatus" class="petStatus">Your spirit companion attacks automatically</div>
</section>
<section id="page" class="screen"><div class="pageHeading"><button id="back">← Village</button><h2 id="pageTitle"></h2></div><div id="pageContent"></div></section>
<div id="draftOverlay" class="overlay" hidden><div class="draftHeader"><div class="eyebrow" id="draftWave"></div><h2>Choose your evolution</h2><p>These powers stack for this run.</p></div><div id="draftCards"></div><div class="draftFooter"><button id="reroll">↻ Reroll · 1 free</button><button id="draftHome">Save & home</button></div></div>
</main>
<dialog id="dialog"><div class="dialogHeading"><h2 id="dialogTitle"></h2><button id="closeDialog" class="iconButton" aria-label="Close">×</button></div><div id="dialogContent"></div></dialog><div id="catchup" class="catchup" hidden role="status"><span class="expIcon" data-exp-icon="0"></span><h2>Your expedition is returning</h2><p id="catchupInfo">Resolving offline waves…</p><button id="catchupStop">Return to this wave now</button></div><div id="toast" role="status"></div><input type="file" id="import" accept=".json,application/json" hidden>
<script src="./forge.js"></script><script src="./expedition.js"></script><script src="./haven.js"></script><script src="./engine.js"></script><script src="./app.js"></script></body></html>
