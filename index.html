<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f7f0"><meta name="description" content="Tap, evolve and unleash a storm of slime-shattering powers."><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon192.png"><link rel="stylesheet" href="./style.css"><title>Slimefall · Loot Legends</title></head>
<body><main id="app">
<header><button id="profileGear" class="profileGear" aria-label="Open equipment"><span class="enemySprite navPet"></span></button><div class="brand">SLIMEFALL<small>LOOT LEGENDS · v7.0</small></div><div class="wallet"><span id="coins">0</span><span id="shards">0</span></div><button id="autoToggle" aria-pressed="false" aria-label="Auto mode">Auto OFF</button><button id="settings" class="iconButton" aria-label="Settings">⚙</button></header><button id="autoStatus" hidden></button>
<section id="home" class="screen active">
<div class="homeHero" id="villageScene"><div class="villageTitle"><div id="homeStats" class="homeStats"></div></div>
<div class="homeShortcutRail leftRail"><button class="sceneShortcut" data-page="village" aria-label="Open mini-games"><span class="shortcutGlyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10c3 0 5 8 4 11-1 2-4-1-6-3H9c-2 2-5 5-6 3-1-3 1-11 4-11ZM7 10v5m-2-2h4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="14" r="1"/></svg></span><small>Games</small></button><button id="homeRewards" class="sceneShortcut goldShortcut" aria-label="Collect idle coins"><span class="shortcutGlyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 0 1 18 0v10H3V10Zm0 3h18M9 3v17m6-17v17"/><path d="M10 11h4v5h-4z"/></svg></span><i id="homeIdleBadge"></i><small>Collect</small></button></div>
<div class="homeShortcutRail rightRail"><button id="homeGear" class="sceneShortcut purpleShortcut" aria-label="Open equipment"><span class="gearIcon" data-gear-icon="1"></span><i id="homeGearBadge" hidden></i><small>Gear</small></button><button id="homeTasks" class="sceneShortcut pinkShortcut" aria-label="Open adventure tasks"><span class="shortcutGlyph">✓</span><i id="homeTaskBadge" hidden></i><small>Tasks</small></button></div>
<div id="restorationMarks" aria-label="Restored landmarks"></div><div class="restoreGlow" aria-hidden="true"></div>
<button id="play" class="primary">NEW ADVENTURE <span>→</span></button><button id="resume" hidden>Continue your run</button>
</div>
<div class="homeBottom" hidden><button id="openTree" class="treeEntry"><span class="treeEntrySymbol">⬡</span><span><b>Grow your skill tree</b><small id="homeTreeInfo">New paths are waiting</small></span><span>→</span></button><div id="homeGoal"></div><button id="expeditionStatus" class="expeditionEntry"><span class="expIcon" data-exp-icon="0"></span><span><b>Offline adventure</b><small id="expeditionInfo">Offline waves are ready</small></span><span>→</span></button><div class="homeExtras"><button id="openForge">Rune forge</button><button id="openResearch">Research</button></div><button id="havenStatus" data-page="village" class="havenStatus"></button><div class="idlePanel frame"><div class="row"><span class="skillIcon" data-icon="11"></span><div><h3>Coins while you rest</h3><p id="idleInfo"></p></div><button id="claimIdle" class="primary">Collect</button></div></div><nav id="homeNav" hidden><button data-page="workshop"><span class="skillIcon" data-icon="0"></span><span>Ascension</span></button><button data-page="collection"><span class="skillIcon" data-icon="33"></span><span>Grimoire</span></button><button data-page="bestiary"><span class="enemySprite navPet"></span><span>Slimes</span></button><button data-page="milestones"><span class="skillIcon" data-icon="15"></span><span>Milestones</span></button></nav></div>
</section>
<section id="combat" class="screen">
<div class="battleHud"><div class="row"><span id="waveLabel"></span><button id="buildInfo" class="tiny">Your build</button><button id="pause" class="tiny" aria-label="Pause">Ⅱ</button></div><div class="row"><span id="health"></span><span id="battleStats"></span></div><div id="realmLabel" class="realmInfo"></div><div id="waveLoot" class="waveLoot"></div><div class="progress"><i id="waveProgress"></i></div></div>
<div id="arena"><canvas id="battleCanvas" aria-label="Slime battlefield. Tap or hold enemies to attack."></canvas><div id="battleBanner" role="status"></div><div id="combo"></div><div class="dangerLine">KEEP THEM ABOVE THE WARD</div></div>
<div class="battleTools"><button id="pilotToggle">Auto · OFF</button><button id="battleForge">✧ Open forge</button><button id="battleOrders">Orders</button></div><aside id="forgeDrawer" hidden aria-label="Moonforge"><div class="drawerHeading"><b>Moonforge · battle continues</b><button id="closeForge">× Close</button></div><div id="drawerContent"></div></aside><div id="actionInfo" class="actionInfo"></div><div class="energyTrack"><i id="energyFill"></i></div><div class="abilities"><button id="frost" class="ability"><span class="skillIcon" data-icon="4"></span><span><b>Frost nova</b><small id="frostLabel">READY</small></span></button><button id="fury" class="ability"><span class="skillIcon" data-icon="2"></span><span><b>Overcharge</b><small id="furyLabel">READY</small></span></button><button id="burst" class="ability"><span class="skillIcon" data-icon="32"></span><span><b>Soul Burst</b><small id="burstLabel">0%</small></span></button></div>
<div id="petStatus" class="petStatus">Your spirit companion attacks automatically</div>
</section>
<section id="page" class="screen"><div class="pageHeading"><button id="back">← Home</button><h2 id="pageTitle"></h2></div><div id="pageContent"></div></section>
<nav id="mainNav" aria-label="Main navigation"><button data-main="home"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10"/></svg></span>Home</button><button data-main="combat"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 3 7 7-3 3-5-7V3h1Zm16 0-7 7 3 3 5-7V3h-1ZM5 15l4 4m-7 1 5-5m12 0-4 4m7 1-5-5"/></svg></span>Fight</button><button data-main="tree"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 4 2.5v5L12 12l-4-2.5v-5L12 2Zm-7 11 4 2.5v5L5 23l-4-2.5v-5L5 13Zm14 0 4 2.5v5L19 23l-4-2.5v-5l4-2.5ZM9 11l-2 3m8-3 2 3"/></svg></span>Skills</button><button data-main="gear"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m7 3 5 3 5-3 5 5-4 4v9H6v-9L2 8l5-5Z"/><path d="M8 4c0 7 8 7 8 0"/></svg></span>Gear<span id="gearNavBadge" hidden></span></button><button data-main="shop"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1 13H5L4 8Zm4 0V6a4 4 0 0 1 8 0v2"/></svg></span>Shop</button></nav>
<div id="draftOverlay" class="overlay" hidden><div class="draftHeader"><div class="eyebrow" id="draftWave"></div><h2>Pick a power</h2><p>Each choice makes this adventure stronger.</p></div><div id="draftCards"></div><div class="draftFooter"><button id="reroll">↻ Reroll · 1 free</button><button id="draftHome">Save & home</button></div></div>
</main>
<dialog id="dialog"><div class="dialogHeading"><h2 id="dialogTitle"></h2><button id="closeDialog" class="iconButton" aria-label="Close">×</button></div><div id="dialogContent"></div></dialog><div id="catchup" class="catchup" hidden role="status"><span class="expIcon" data-exp-icon="0"></span><h2>Your expedition is returning</h2><p id="catchupInfo">Resolving offline waves…</p><button id="catchupStop">Return to this wave now</button></div><div id="toast" role="status"></div><input type="file" id="import" accept=".json,application/json" hidden>
<script src="./format.js"></script><script src="./gear.js"></script><script src="./tree.js"></script><script src="./forge.js"></script><script src="./expedition.js"></script><script src="./haven.js"></script><script src="./engine.js"></script><script src="./app.js"></script></body></html>
